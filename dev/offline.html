<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مسار — لا يوجد اتصال</title>
<style>
  :root { --bg: #FAF6F1; --ink: #3D2B1E; --accent: #EE7126; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1511; --ink: #f1e7dd; } }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font: 16px/1.7 system-ui, "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; }
  .box { max-width: 360px; }
  .ico { font-size: 56px; }
  h1 { font-size: 20px; margin: 8px 0; }
  p { margin: 6px 0 18px; opacity: .85; }
  button { border: none; background: var(--accent); color: #fff; font: 700 16px inherit; padding: 12px 28px; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <div class="ico">📡</div>
  <h1>لا يوجد اتصال بالإنترنت</h1>
  <p>يحتاج مسار إلى الاتصال لعرض البيانات وحفظ العمليات. تأكد من الشبكة ثم أعد المحاولة.</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة</button>
</div>
</body>
</html>
